main{padding-bottom:104px}
.customer-tabs{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:900px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0b0d0ff5;border-top:1px solid #30363b;backdrop-filter:blur(16px)}

.code-panel .field{margin:8px 0 4px}

.code-panel .code-feedback.good{color:#90e7a4}.code-panel .code-feedback.bad{color:#ffab97}
.table-lock{display:inline-flex;align-items:center;gap:7px;background:#24292d;border:1px solid #363b40;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800}
.business-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.business-tabs button{min-height:48px;border:1px solid var(--line);border-radius:14px;background:#171a1d;color:var(--ink);font-weight:800;padding:10px}
.business-tabs button.active{background:var(--brand);border-color:var(--brand);color:#1a1009}
.business-tabs .navbadge{margin-left:6px}
.setup-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.qr-sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.qr-card{background:#fff;color:#111;border-radius:12px;padding:12px;text-align:center;break-inside:avoid;min-width:0}
.qr-card strong{display:block;font-size:18px;letter-spacing:.03em}
.qr-img{width:100%;max-width:180px;margin:7px auto 4px}.qr-img svg{display:block;width:100%;height:auto}
.qr-url{font-size:9px;color:#555;overflow-wrap:anywhere}
.code-sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.code-sheet-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#111417;padding:10px 12px;border-radius:12px}
.code-sheet-row strong{font-size:16px;letter-spacing:.05em;color:var(--brand)}.code-sheet-row span{font-size:13px;color:var(--muted)}
.order-card{background:#fffaf2;color:#21180f;border:1px solid #f3c99b;border-radius:13px;padding:12px;min-width:0}

.order-card-table{font-size:18px;font-weight:900;margin:3px 0 8px;color:#21180f}

.order-card-note{font-size:12px;background:#fff0d8;border-radius:8px;padding:8px;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.order-card-total{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:8px;border-top:2px solid #e7cba9;font-weight:900;font-size:16px}
.chatbubble:has(.order-card){max-width:96%;padding:5px;background:transparent;border:0}
.qr-placeholder{grid-column:1/-1;text-align:center;padding:20px;border:1px dashed #41474d;border-radius:14px;color:var(--muted)}
@media(min-width:600px){.qr-sheet{grid-template-columns:repeat(3,minmax(0,1fr))}.code-sheet{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:390px){.customer-tabs{gap:6px;padding-left:8px;padding-right:8px}.customer-tabs button{font-size:13px}.qr-sheet{gap:8px}.qr-card{padding:8px}.code-sheet{grid-template-columns:1fr}}

<script>
(function(){

{id:'share',name:'To share',items:[{id:'bravas',name:'Patatas bravas',description:'Crispy potatoes with house brava sauce.',image:'https://images.unsplash.com/photo-1518013431117-eb1465fa5752?auto=format&fit=crop&w=900&q=80',price:5.5,allergens:['Gluten']},{id:'croquetas',name:'Homemade croquettes',description:'Today’s selection, six pieces.',image:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80',price:8,allergens:['Gluten','Dairy']},{id:'tortilla',name:'Spanish omelette',description:'Traditional potato omelette.',image:'https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=900&q=80',price:7.5,allergens:['Egg']}]},
{id:'mains',name:'Main dishes',items:[{id:'chicken',name:'Roast chicken',description:'With potatoes and Mediterranean herbs.',image:'https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=900&q=80',price:13.9,allergens:[]},{id:'veg',name:'Grilled vegetables',description:'Seasonal vegetables with olive oil.',image:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=80',price:11.5,allergens:[]}]},
{id:'drinks',name:'Drinks',items:[{id:'water',name:'Mineral water',description:'Still or sparkling.',image:'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=900&q=80',price:2,allergens:[]},{id:'lemonade',name:'Homemade lemonade',description:'Freshly squeezed lemon.',image:'https://images.unsplash.com/photo-1513558161293-cdaf765edfd7?auto=format&fit=crop&w=900&q=80',price:3.5,allergens:[]}]}
]};
let menu=clone(DEMO),storageWorks=false,view='customer',customerTab='menu',businessTab='orders',query='',category='all',table=new URLSearchParams(location.search).get('t')||'3',dailyCodeInput='',cart={},orderNote='',notice='',editorText='',fileName='',staffAuthenticated=false,staffEmail='',dinerUid=null,authBusy=false,chatOpen=false,chatMessages=[],chatChannel=null,bizChannel=null,activeChatTable=null,activeDailyCode='',activeView=null,chatIds=new Set(),chatReady=false,chatError='',bizThreads={},unreadTables=new Set(),dinerUnread=false,qrSheetReady=false;

function money(v){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:menu.currency||'EUR'}).format(Number(v)||0)}catch(e){return (Number(v)||0).toFixed(2)+' '+(menu.currency||'EUR')}}

function normalise(x){const y=clone(x);y.whatsapp=String(y.whatsapp||'');y.currency=String(y.currency||'EUR').toUpperCase();y.accent=/^#[0-9a-f]{6}$/i.test(y.accent||'')?y.accent:'#ff7a18';y.categories=y.categories.map((c,ci)=>({id:String(c.id||('category-'+ci)),name:String(c.name||('Category '+(ci+1))),items:c.items.map((i,ii)=>({id:String(i.id||('item-'+ci+'-'+ii)),name:String(i.name||('Item '+(ii+1))),description:String(i.description||''),image:String(i.image||''),price:Number(i.price)||0,allergens:Array.isArray(i.allergens)?i.allergens.map(String):String(i.allergens||'').split('|').map(s=>s.trim()).filter(Boolean)}))}));return ensureTableConfig(y)}

 if(activeView!==view){

 }

function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);if(rows.length<2)throw Error('CSV needs a header row and at least one menu item.');const headers=rows.shift().map(h=>h.trim().toLowerCase());const at=k=>headers.indexOf(k);if(at('name')<0||at('price')<0)throw Error('CSV must include at least name and price columns.');const cats={};rows.forEach((r,i)=>{const val=k=>at(k)<0?'':String(r[at(k)]||'').trim();const cat=val('category')||'Menu';if(!cats[cat])cats[cat]={id:slug(cat),name:cat,items:[]};const price=Number(val('price').replace(',','.'));if(!Number.isFinite(price)||price<0)throw Error('Invalid price on CSV row '+(i+2)+'.');const name=val('name');if(!name)throw Error('Missing item name on CSV row '+(i+2)+'.');cats[cat].items.push({id:slug(name)+'-'+(i+1),name,description:val('description'),price,allergens:val('allergens').split('|').map(x=>x.trim()).filter(Boolean)})});return {name:'Imported Restaurant',whatsapp:'',currency:'EUR',categories:Object.values(cats)}}

function normalCode(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'')}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function seededRandom(seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
function shuffleSeeded(list,seed){const a=list.slice(),rnd=seededRandom(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ensureTableConfig(x){x=x||{};const parsed=Math.floor(Number(x.tables));x.tables=Number.isFinite(parsed)?Math.max(1,Math.min(50,parsed)):10;x.secret=String(x.secret||'table-lab-demo-secret-rotate-before-launch');x.dailyShuffle=x.dailyShuffle!==false;const pool=shuffleSeeded(Array.from(new Set(KEYWORD_BANK)),x.secret+'|keyword-bank');let words=Array.isArray(x.keywords)?x.keywords.map(normalCode).filter(Boolean):[];const used=new Set(words);for(const w of pool){if(words.length>=100)break;if(!used.has(w)){words.push(w);used.add(w)}}x.keywords=words.slice(0,Math.max(100,x.tables*2));return x}
function dailyPairs(x){const cfg=ensureTableConfig(clone(x));const chosen=shuffleSeeded(cfg.keywords,cfg.secret+'|'+todayKey());return Array.from({length:cfg.tables},(_,i)=>({table:i+1,code:chosen[i]}))}
function validDailyCode(tableNumber,code){const n=Number(tableNumber);if(!Number.isInteger(n)||n<1||n>50)return false;const cfg=ensureTableConfig(clone(menu));const chosen=cfg.dailyShuffle?shuffleSeeded(cfg.keywords,cfg.secret+'|'+todayKey()):cfg.keywords;return normalCode(chosen[n-1]||'')===normalCode(code||'')&&normalCode(code||'')!==''}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item'}
function parseImported(text,name){if((name||'').toLowerCase().endsWith('.csv')||text.trimStart().toLowerCase().startsWith('category,name,'))return parseCSV(text);let x=JSON.parse(text);if(x.restaurants){const id=Object.keys(x.restaurants)[0];if(!id)throw Error('No restaurants found in JSON.');x=x.restaurants[id]}if(!valid(x))throw Error('Menu structure is not valid. Include name, categories, category names, items, item names and numeric prices.');return normalise(x)}

async function bindStaffAuth(){
 const sb=supabaseClient();if(!sb){const feedback=document.getElementById('authFeedback');if(feedback)feedback.textContent='Supabase is not configured. Chat and staff login are unavailable.';return}
 const form=document.getElementById('staffLogin');
 if(form)form.onsubmit=async e=>{
  e.preventDefault();const email=document.getElementById('staffEmail').value.trim(),password=document.getElementById('staffPassword').value,feedback=document.getElementById('authFeedback'),button=form.querySelector('button[type="submit"]');
  if(!email||!password)return;authBusy=true;if(button)button.disabled=true;if(feedback)feedback.textContent='Signing in…';
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){authBusy=false;if(button)button.disabled=false;if(feedback)feedback.textContent=error.message;return}
  const {data:staff,error:staffErr}=await sb.from('staff_members').select('user_id').eq('user_id',data.user.id).maybeSingle();
  if(staffErr||!staff){await sb.auth.signOut();authBusy=false;if(button)button.disabled=false;if(feedback)feedback.textContent='This account is not authorized as restaurant staff.';return}
  staffAuthenticated=true;staffEmail=data.user.email||email;authBusy=false;render();
 };
 const signout=document.getElementById('staffSignOut');
 if(signout)signout.onclick=async()=>{if(bizChannel){try{await sb.removeChannel(bizChannel)}catch(e){}bizChannel=null}await sb.auth.signOut();staffAuthenticated=false;staffEmail='';render()};
 try{
  const {data:{session}}=await sb.auth.getSession();
  let authorized=false,email='';
  if(session&&!session.user.is_anonymous){const {data:staff,error}=await sb.from('staff_members').select('user_id').eq('user_id',session.user.id).maybeSingle();authorized=!error&&!!staff;email=session.user.email||'';if(!authorized)await sb.auth.signOut()}
  const changed=authorized!==staffAuthenticated;
  staffAuthenticated=authorized;staffEmail=authorized?email:'';
  if(changed&&view==='business')render();
 }catch(e){}
}
function supabaseClient(){try{if(!window.supabase||!window.TL_CONFIG||!TL_CONFIG.url||!TL_CONFIG.key)return null;return window.__tlSb||(window.__tlSb=window.supabase.createClient(TL_CONFIG.url,TL_CONFIG.key,{realtime:{params:{eventsPerSecond:8}}}))}catch(e){return null}}
function chatTable(){const n=Number(new URLSearchParams(location.search).get('t')||table||3);return Number.isInteger(n)&&n>=1&&n<=50?n:3}
const ORDER_CARD_PREFIX='::TABLELAB_ORDER_V1::';
function parseOrderCard(body){if(!String(body||'').startsWith(ORDER_CARD_PREFIX))return null;try{const x=JSON.parse(String(body).slice(ORDER_CARD_PREFIX.length));return x&&x.v===1?x:null}catch(e){return null}}
function formatOrderCardHtml(x){const lines=(x.i||[]).map(i=>'<div class="order-card-line"><span>'+esc(i.q)+' × '+esc(i.n)+'</span><strong>'+money((Number(i.p)||0)*(Number(i.q)||0))+'</strong></div>'+(i.x?'<div class="small">Note: '+esc(i.x)+'</div>':'')).join('');return '<article class="order-card"><div class="order-card-header"><span>Order request</span><span>Table '+esc(x.t)+'</span></div><div class="order-card-table">Please prepare</div>'+lines+(x.n?'<div class="order-card-note"><strong>Order note</strong><br>'+esc(x.n)+'</div>':'')+'<div class="order-card-total"><span>Total · '+esc(x.c||menu.currency)+'</span><span>'+money(x.s)+'</span></div></article>'}
function messageHtml(m,mine){const order=parseOrderCard(m.body);return '<div class="chatbubble '+(order?'orderbubble':mine?'mine':m.sender==='business'?'staff':'mine')+'" data-mid="'+esc(m.id)+'">'+(order?formatOrderCardHtml(order):esc(m.body))+'<div class="chatmeta">'+esc(new Date(m.created_at||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))+'</div></div>'}
function threadKey(m){return String(m.table_no)+'|'+normalCode(m.daily_code||'')}
function dinerChatMarkup(){return '<section class="chatbox"><div class="chathead"><div><div class="eyebrow">TABLE '+esc(table)+'</div><strong>Chat with staff</strong><div id="chatStatus" class="status">Connecting…</div></div><button class="btn" id="refreshChat" aria-label="Refresh chat">↻</button></div><div id="chatLog" class="chatlog"><div class="empty">Loading recent messages…</div></div><form id="chatForm" class="chatform"><input id="chatMessage" maxlength="1000" placeholder="Message the team…" autocomplete="off" required><button aria-label="Send message">↑</button></form><p class="small">Order requests appear as cards in this thread. WhatsApp remains available if chat is offline.</p></section>'}
function paintBubble(container,m,mine){if(!container||!m)return;const id=m.id||('local-'+m.sender+'-'+m.created_at+'-'+m.body);if(container.querySelector('[data-mid="'+CSS.escape(String(id))+'"]'))return;const d=document.createElement('div');const order=parseOrderCard(m.body);d.className='chatbubble '+(order?'orderbubble':mine?'mine':m.sender==='business'?'staff':'mine');d.dataset.mid=String(id);if(order)d.innerHTML=formatOrderCardHtml(order);else d.textContent=m.body;const meta=document.createElement('div');meta.className='chatmeta';meta.textContent=new Date(m.created_at||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});d.appendChild(meta);container.appendChild(d);container.scrollTop=container.scrollHeight}
function showChatStatus(text,error){const el=document.getElementById('chatStatus')||document.getElementById('businessChatStatus');if(el){el.textContent=text;el.classList.toggle('error',!!error)}}
function bindDinerChat(){bindDailyCode();const refresh=document.getElementById('refreshChat');if(refresh)refresh.onclick=()=>fetchTableMessages(chatTable(),normalCode(dailyCodeInput))}
async function ensureDinerAuth(){const sb=supabaseClient();if(!sb)return null;const {data:{session}}=await sb.auth.getSession();if(session&&session.user.is_anonymous){dinerUid=session.user.id;return dinerUid}if(session&&!session.user.is_anonymous)throw new Error('For testing, open the customer link in a private/incognito tab or on a second device.');const {data,error}=await sb.auth.signInAnonymously();if(error)throw error;dinerUid=data.user.id;return dinerUid}
async function fetchTableMessages(T,code){const sb=supabaseClient();if(!sb)return;const uid=await ensureDinerAuth().catch(e=>{showChatStatus('Chat sign-in failed: '+e.message,true);return null});if(!uid)return;const {data,error}=await sb.from('messages').select('*').eq('restaurant_id',TL_CONFIG.restaurantId).eq('table_no',T).eq('diner_uid',uid).eq('daily_code',code).gte('created_at',new Date(Date.now()-24*60*60*1000).toISOString()).order('created_at',{ascending:true}).limit(300);if(error){chatError=error.message;showChatStatus('Chat unavailable. WhatsApp is still available.',true);return}chatMessages=data||[];chatIds=new Set(chatMessages.map(m=>String(m.id)));const log=document.getElementById('chatLog');if(log){log.innerHTML='';if(!chatMessages.length)log.innerHTML='<div class="empty">No messages yet. Ask us anything.</div>';chatMessages.forEach(m=>paintBubble(log,m,m.sender==='table'))}}
async function startDinerChat(){
 const T=chatTable(),code=normalCode(dailyCodeInput);
 if(!validDailyCode(T,code)){showChatStatus('Enter the correct word printed for this table today.',true);return}
 const sb=supabaseClient();if(!sb){showChatStatus('Chat configuration missing. WhatsApp is still available.',true);return}
 try{await ensureDinerAuth()}catch(e){showChatStatus('Chat sign-in failed. WhatsApp is still available.',true);return}
 if(customerTab==='chat')await fetchTableMessages(T,code);
 const form=document.getElementById('chatForm');
 if(form)form.onsubmit=async e=>{e.preventDefault();const input=document.getElementById('chatMessage'),body=input.value.trim();if(!body)return;if(body.length>1000){showChatStatus('Keep messages under 1,000 characters.',true);return}input.value='';const row={restaurant_id:TL_CONFIG.restaurantId,table_no:T,diner_uid:dinerUid,daily_code:code,sender:'table',body};const {data,error}=await sb.from('messages').insert(row).select('*').single();if(error){showChatStatus('Message not sent: '+error.message,true);input.value=body;return}if(data&&!chatIds.has(String(data.id))){chatIds.add(String(data.id));chatMessages.push(data);const l=document.getElementById('chatLog');if(l){if(l.querySelector('.empty'))l.innerHTML='';paintBubble(l,data,true)}}};
 if(chatChannel&&activeChatTable===T&&activeDailyCode===code){showChatStatus('Connected · Table '+T,false);return}
 if(chatChannel){try{await sb.removeChannel(chatChannel)}catch(e){}chatChannel=null}
 activeChatTable=T;activeDailyCode=code;
 chatChannel=sb.channel('table-chat-'+TL_CONFIG.restaurantId+'-'+T+'-'+code+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'restaurant_id=eq.'+TL_CONFIG.restaurantId},payload=>{
  const m=payload.new;if(Number(m.table_no)!==T||String(m.diner_uid||'')!==String(dinerUid)||normalCode(m.daily_code||'')!==code)return;if(chatIds.has(String(m.id)))return;chatIds.add(String(m.id));chatMessages.push(m);
  if(m.sender==='business'){if(customerTab==='chat'){const l=document.getElementById('chatLog');if(l){if(l.querySelector('.empty'))l.innerHTML='';paintBubble(l,m,false)}}else{dinerUnread=true;const badge=document.getElementById('dinerUnreadBadge');if(badge)badge.classList.remove('hidden')}showChatStatus('Staff replied',false);try{if(navigator.vibrate)navigator.vibrate(80)}catch(e){}}
  else if(customerTab==='chat'){const l=document.getElementById('chatLog');if(l){if(l.querySelector('.empty'))l.innerHTML='';paintBubble(l,m,true)}}
 }).subscribe(status=>{if(status==='SUBSCRIBED'){chatReady=true;showChatStatus('Connected · Table '+T,false);if(customerTab==='chat')fetchTableMessages(T,code)}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')showChatStatus('Reconnecting… WhatsApp remains available.',true)});
}
function playNotice(){try{if(navigator.vibrate)navigator.vibrate([80,40,80]);const C=window.AudioContext||window.webkitAudioContext;if(C){const ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=660;g.gain.value=.04;o.start();o.stop(ctx.currentTime+.12)}}catch(e){}}
async function startBusinessChat(){
 if(!staffAuthenticated)return;
 const sb=supabaseClient(),wrap=document.getElementById('businessThreads');if(!sb||!wrap)return;
 const st=document.getElementById('businessChatStatus');
 const load=async()=>{const {data,error}=await sb.from('messages').select('*').eq('restaurant_id',TL_CONFIG.restaurantId).gte('created_at',new Date(Date.now()-24*60*60*1000).toISOString()).order('created_at',{ascending:true}).limit(1000);if(error){if(st){st.textContent='Chat connection failed: '+error.message;st.className='error'}return}const grouped={};(data||[]).forEach(m=>{const k=threadKey(m);(grouped[k]||(grouped[k]=[])).push(m)});bizThreads=grouped;renderBusinessThreads();if(st){st.textContent='Live chat connected · '+Object.keys(grouped).length+' table thread(s)';st.className='notice success'}};
 await load();
 if(bizChannel)return;
 bizChannel=sb.channel('business-inbox-'+TL_CONFIG.restaurantId+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'restaurant_id=eq.'+TL_CONFIG.restaurantId},payload=>{const m=payload.new,k=threadKey(m),arr=bizThreads[k]||(bizThreads[k]=[]);if(arr.some(x=>String(x.id)===String(m.id)))return;arr.push(m);if(m.sender==='table')unreadTables.add(k);renderBusinessThreads();if(m.sender==='table')playNotice()}).subscribe(status=>{if(st&&status==='SUBSCRIBED'){st.textContent='Live chat connected';st.className='notice success'}else if(st&&(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')){st.textContent='Reconnecting to chat…';st.className='notice'}});
}
async function refreshBusinessHistory(){const sb=supabaseClient();if(!sb)return;const {data,error}=await sb.from('messages').select('*').eq('restaurant_id',TL_CONFIG.restaurantId).gte('created_at',new Date(Date.now()-24*60*60*1000).toISOString()).order('created_at',{ascending:true}).limit(1000);if(error)return;const grouped={};(data||[]).forEach(m=>{const k=threadKey(m);(grouped[k]||(grouped[k]=[])).push(m)});bizThreads=grouped;renderBusinessThreads()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(view==='business'&&staffAuthenticated)refreshBusinessHistory();else if(view==='customer'&&chatOpen)fetchTableMessages(chatTable())}});
window.addEventListener('online',()=>{if(view==='business'&&staffAuthenticated)refreshBusinessHistory();else if(view==='customer'&&chatOpen)fetchTableMessages(chatTable())});
function renderBusinessThreads(newUnread){
 const wrap=document.getElementById('businessThreads');
 const tab=app.querySelector('[data-biztab="orders"]');
 if(tab)tab.innerHTML='Orders &amp; chats '+(unreadTables.size?'<span class="navbadge">'+unreadTables.size+'</span>':'');
 if(!wrap)return;
 const keys=Object.keys(bizThreads).sort((a,b)=>{const aa=bizThreads[a]||[],bb=bizThreads[b]||[];return new Date(bb[bb.length-1]?.created_at||0).getTime()-new Date(aa[aa.length-1]?.created_at||0).getTime()});
 if(!keys.length){wrap.innerHTML='<div class="empty">No conversations yet. Messages from diners will appear here.</div>';return}
 wrap.innerHTML=keys.map(k=>{const ms=bizThreads[k],last=ms[ms.length-1],unread=unreadTables.has(k),parts=k.split('|'),tableNo=parts[0],code=parts.slice(1).join('|'),order=parseOrderCard(last&&last.body),summary=order?'Order request · '+money(order.s):last?last.body:'No messages';return '<article class="threadcard '+(unread?'unread':'')+'" data-thread="'+esc(k)+'"><div class="threadhead"><h4>Table '+esc(tableNo)+'</h4>'+(unread?'<span class="unreadbadge">NEW</span>':'')+'</div><div class="thread-meta">'+(code?'Daily code · '+esc(code.toUpperCase()):'No word code')+'</div><div class="small">'+esc(summary)+'</div><div class="threadlog" id="threadlog-'+esc(k)+'">'+ms.map(m=>messageHtml(m,m.sender==='business')).join('')+'</div><form class="chatform" data-reply="'+esc(k)+'"><input maxlength="1000" placeholder="Reply to Table '+esc(tableNo)+'…" required><button aria-label="Send reply">↑</button></form></article>'}).join('');
 if(newUnread)unreadTables.add(String(newUnread));
 wrap.querySelectorAll('[data-thread]').forEach(card=>card.onclick=e=>{if(e.target.closest('form'))return;const k=card.dataset.thread;unreadTables.delete(k);card.classList.remove('unread');const badge=card.querySelector('.unreadbadge');if(badge)badge.remove();if(tab)tab.innerHTML='Orders &amp; chats '+(unreadTables.size?'<span class="navbadge">'+unreadTables.size+'</span>':'')});
 wrap.querySelectorAll('[data-reply]').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const raw=form.dataset.reply,parts=raw.split('|'),T=Number(parts.shift()),code=parts.join('|'),input=form.querySelector('input'),body=input.value.trim();if(!body)return;if(body.length>1000){alert('Keep replies under 1,000 characters.');return}const sb=supabaseClient();if(!sb){alert('Chat configuration is missing.');return}const thread=bizThreads[raw]||[],lastTableMessage=[...thread].reverse().find(m=>m.sender==='table');if(!lastTableMessage){alert('This table has not opened a chat yet.');return}input.value='';const row={restaurant_id:TL_CONFIG.restaurantId,table_no:T,diner_uid:lastTableMessage.diner_uid,daily_code:code,sender:'business',body};const {data,error}=await sb.from('messages').insert(row).select('*').single();if(error){alert('Reply not sent: '+error.message);input.value=body;return}const arr=bizThreads[raw]||(bizThreads[raw]=[]);if(data&&!arr.some(m=>String(m.id)===String(data.id)))arr.push(data);renderBusinessThreads()});
 wrap.querySelectorAll('.threadlog').forEach(l=>l.scrollTop=l.scrollHeight);
}
})();
