<style>
:root{color-scheme:dark;--bg:#090b0d;--ink:#f6f6f4;--muted:#9da1a4;--line:#272b2f;--card:#14171a;--brand:#ff7a18;--soft:#27170e;--ok:#18321f;--warn:#33280f;--radius:20px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b9ff3b;outline-offset:3px}main{max-width:900px;margin:auto;padding-bottom:36px}.top{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#0b0d0ff2;position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}.logo{font-weight:950;color:var(--brand);letter-spacing:-.08em;font-size:25px}.top h1{font-size:16px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav{display:flex;gap:6px}.nav button{min-height:44px;padding:8px 12px;border-radius:13px;border:1px solid var(--line);background:#171a1d;color:var(--ink);font-size:14px}.nav button.active{background:var(--brand);color:#17100b;border-color:var(--brand);font-weight:800}.hero,.panel{padding:22px 16px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}h2{font-size:clamp(29px,7vw,42px);line-height:1.04;margin:8px 0 10px;letter-spacing:-.045em}h3{font-size:20px;margin:24px 0 10px}.muted,.hint{color:var(--muted)}.hint{font-size:13px}.search,.field input,.field textarea,.field select,textarea.editor{display:block;width:100%;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#171a1d;color:var(--ink)}.search{margin:0 16px 12px;width:calc(100% - 32px)}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.pill{white-space:nowrap;border:1px solid var(--line);border-radius:24px;padding:10px 15px;background:#171a1d;color:var(--ink);min-height:44px}.pill.active{background:var(--brand);border-color:var(--brand);color:#1a1009;font-weight:850}.item{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid #202428;border-radius:var(--radius);padding:14px;margin:9px 12px;box-shadow:0 8px 24px #0002}.dishphoto{display:block;width:100%;height:118px;object-fit:cover;border-radius:13px;margin-bottom:10px;background:#25292d}.itemmain{flex:1;min-width:0}.itemname{font-weight:800;font-size:17px;letter-spacing:-.02em}.desc{font-size:13px;color:var(--muted);margin:4px 0 8px}.price{font-weight:900;color:var(--brand);font-size:16px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:11px;background:#262a2e;color:#d7dadc;border-radius:7px;padding:3px 8px}.add{flex:0 0 46px;width:46px;height:46px;align-self:center;border:0;border-radius:16px;background:var(--brand);color:#170e08;font-weight:900;font-size:27px}.btn{min-height:46px;padding:11px 15px;border:1px solid var(--line);border-radius:14px;background:#171a1d;color:var(--ink);display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none}.btn.primary{background:var(--brand);color:#1a1009;border-color:var(--brand);font-weight:850}.btn.danger{color:#ff9c83;border-color:#633025}.btn.full{display:flex;width:100%;margin:12px 0}.btn:disabled{opacity:.45}.cartbar{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:730px;background:#171a1d;color:var(--ink);border:1px solid #34393e;border-radius:20px;padding:12px 13px;display:flex;gap:12px;justify-content:space-between;align-items:center;font-weight:800;box-shadow:0 10px 32px #0008;z-index:8;min-height:72px}.cartbar .cartamount{display:flex;flex-direction:column;line-height:1.3}.cartbar .cartcta{border:0;background:var(--brand);color:#170e08;padding:13px 15px;border-radius:14px;font-weight:900;min-height:48px;white-space:nowrap}.screen{padding:18px 16px}.field{display:block;font-weight:700;margin:14px 0 6px}.field input,.field textarea,.field select{margin-top:6px;font-weight:400}.field textarea{resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:15px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}.notice{padding:13px;border-radius:13px;background:var(--warn);margin:12px 0;font-size:14px}.success{background:var(--ok)}.error{background:#3b1715;color:#ffb8aa;padding:13px;border-radius:13px;white-space:pre-wrap}.cartline{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.grow{flex:1;min-width:0}.stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.stepper button{width:44px;min-width:44px;height:44px;min-height:44px;border:1px solid #363b40;border-radius:12px;background:#202428;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}.stepper .qty{min-width:20px;text-align:center}.stepper .remove{width:44px;min-width:44px;height:44px;padding:0;border-color:#633025;color:#ff9c83;background:#261613;font-size:20px}.total{display:flex;justify-content:space-between;gap:12px;font-size:21px;font-weight:900;margin:18px 0;align-items:center}.total span:last-child{white-space:nowrap;color:var(--brand)}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.editor{min-height:270px;font:13px/1.45 ui-monospace,SFMono-Regular,monospace;white-space:pre;tab-size:2}.actions{display:grid;gap:9px}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}.bottom-space{height:110px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 16px 8px}.sectionhead h3{margin:0}.sectionhead button{background:none;border:0;color:var(--brand);font-weight:800}.chatbox{border:1px solid #30363b;background:#111417;border-radius:20px;padding:14px;margin:12px}.chathead{display:flex;align-items:center;justify-content:space-between;gap:8px}.chatlog{height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px 2px;scroll-behavior:smooth}.chatbubble{max-width:84%;padding:10px 12px;border-radius:15px;background:#24292d;overflow-wrap:anywhere;white-space:pre-wrap}.chatbubble.mine{align-self:flex-end;background:var(--brand);color:#1a1009}.chatbubble.staff{align-self:flex-start;background:#24292d}.chatmeta{font-size:10px;opacity:.7;margin-top:4px}.chatform{display:flex;gap:8px;align-items:center}.chatform input{flex:1;min-width:0;border:1px solid #353b40;border-radius:14px;padding:12px;background:#1b1f23;color:var(--ink)}.chatform button{min-width:48px;min-height:48px;border:0;border-radius:14px;background:var(--brand);color:#1a1009;font-weight:900}.status{font-size:12px;color:var(--muted)}.threadlist{display:grid;gap:12px}.threadcard{border:1px solid #30363b;background:#111417;border-radius:18px;padding:14px}.threadcard.unread{border-color:var(--brand);box-shadow:0 0 0 1px #ff7a1833}.threadcard h4{margin:0;font-size:17px}.threadhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.unreadbadge{background:var(--brand);color:#1a1009;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:900}.threadlog{height:210px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:10px 0}.threadlog .chatbubble{font-size:14px}.chatorder{margin:8px 0 12px}.authpanel{max-width:520px;margin:18px auto;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.authpanel h3{margin-top:0}.authpanel .field{margin-top:12px}.accentline{height:3px;width:42px;background:var(--brand);border-radius:4px;margin:12px 0}@media(min-width:600px){.hero{padding-top:30px}.item{margin-left:16px;margin-right:16px}.panel,.screen{padding:24px 20px}.chatbox{margin:16px}.threadlist{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:390px){.top{gap:7px;padding:10px}.top h1{font-size:14px}.nav{gap:4px}.nav button{padding:7px 9px;font-size:13px}.grid{grid-template-columns:1fr}.cartline{padding:12px;gap:8px}.stepper{gap:6px}.total{font-size:19px}.cartbar{gap:8px;padding:10px}.cartbar .cartcta{padding:12px 10px;font-size:14px}}
</style>

<body><main id="app"><section class="panel">Loading demo…</section></main>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
const KEY='tablelab-offline-menu-v2';
const DEMO={name:'Demo Restaurant',whatsapp:'34900000000',currency:'EUR',accent:'#ff7a18',categories:[
{id:'share',name:'To share',items:[{id:'bravas',name:'Patatas bravas',description:'Crispy potatoes with house brava sauce.',image:'https://images.unsplash.com/photo-1518013431117-eb1465fa5752?auto=format&fit=crop&w=900&q=80',price:5.5,allergens:['Gluten']},{id:'croquetas',name:'Homemade croquettes',description:'Today’s selection, six pieces.',image:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80',price:8,allergens:['Gluten','Dairy']},{id:'tortilla',name:'Spanish omelette',description:'Traditional potato omelette.',image:'https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=900&q=80',price:7.5,allergens:['Egg']}]},
{id:'mains',name:'Main dishes',items:[{id:'chicken',name:'Roast chicken',description:'With potatoes and Mediterranean herbs.',image:'https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=900&q=80',price:13.9,allergens:[]},{id:'veg',name:'Grilled vegetables',description:'Seasonal vegetables with olive oil.',image:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=80',price:11.5,allergens:[]}]},
{id:'drinks',name:'Drinks',items:[{id:'water',name:'Mineral water',description:'Still or sparkling.',image:'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=900&q=80',price:2,allergens:[]},{id:'lemonade',name:'Homemade lemonade',description:'Freshly squeezed lemon.',image:'https://images.unsplash.com/photo-1513558161293-cdaf765edfd7?auto=format&fit=crop&w=900&q=80',price:3.5,allergens:[]}]}
]};
let menu=clone(DEMO),storageWorks=false,view='customer',query='',category='all',table=new URLSearchParams(location.search).get('t')||'3',cart={},orderNote='',notice='',editorText='',fileName='',staffAuthenticated=false,staffEmail='',dinerUid=null,authBusy=false,chatOpen=false,chatMessages=[],chatChannel=null,bizChannel=null,activeChatTable=null,activeView=null,chatIds=new Set(),chatReady=false,chatError='',bizThreads={},unreadTables=new Set();
const app=document.getElementById('app');
function clone(x){return JSON.parse(JSON.stringify(x))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:menu.currency||'EUR'}).format(Number(v)||0)}catch(e){return (Number(v)||0).toFixed(2)+' '+(menu.currency||'EUR')}}
function allItems(){return menu.categories.flatMap(c=>c.items.map(i=>({...i,category:c.name})))}
function getItem(id){return allItems().find(x=>x.id===id)}
function safePhone(){return String(menu.whatsapp||'').replace(/\D/g,'')}
function saveStorage(){try{localStorage.setItem(KEY,JSON.stringify(menu));storageWorks=true;return true}catch(e){storageWorks=false;return false}}
function loadStorage(){try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(valid(data))menu=normalise(data)}storageWorks=true}catch(e){storageWorks=false}}
function valid(x){return x&&typeof x.name==='string'&&Array.isArray(x.categories)&&x.categories.length>0&&x.categories.every(c=>c&&typeof c.name==='string'&&Array.isArray(c.items)&&c.items.every(i=>i&&typeof i.name==='string'&&Number.isFinite(Number(i.price))&&Number(i.price)>=0))}
function normalise(x){const y=clone(x);y.whatsapp=String(y.whatsapp||'');y.currency=String(y.currency||'EUR').toUpperCase();y.accent=/^#[0-9a-f]{6}$/i.test(y.accent||'')?y.accent:'#ff7a18';y.categories=y.categories.map((c,ci)=>({id:String(c.id||('category-'+ci)),name:String(c.name||('Category '+(ci+1))),items:c.items.map((i,ii)=>({id:String(i.id||('item-'+ci+'-'+ii)),name:String(i.name||('Item '+(ii+1))),description:String(i.description||''),image:String(i.image||''),price:Number(i.price)||0,allergens:Array.isArray(i.allergens)?i.allergens.map(String):String(i.allergens||'').split('|').map(s=>s.trim()).filter(Boolean)}))}));return y}
function demoJSON(){return JSON.stringify(menu,null,2)}
function setView(v){view=v;notice='';if(v==='business')editorText=demoJSON();history.replaceState(null,'',location.pathname+location.search+'#'+v);render()}
function render(){if(activeView!==view){if(chatChannel&&window.__tlSb){window.__tlSb.removeChannel(chatChannel);chatChannel=null;activeChatTable=null}if(bizChannel&&window.__tlSb){window.__tlSb.removeChannel(bizChannel);bizChannel=null}activeView=view}document.title=(view==='business'?'Business inbox':'Table Lab')+' · '+menu.name;document.documentElement.style.setProperty('--brand',menu.accent||'#ff7a18');app.innerHTML=header()+(view==='business'?businessPage():view==='cart'?cartPage():customerPage());bindNav();if(view==='business'){bindBusiness();bindStaffAuth();if(staffAuthenticated&&!bizChannel)startBusinessChat()}else if(view==='cart')bindCart();else{bindCustomer();if(chatOpen)startDinerChat()}}
function header(){return '<header class="top"><div class="logo">TL</div><h1>'+esc(menu.name)+'</h1><nav class="nav"><button data-view="customer" class="'+(view!=='business'?'active':'')+'">Customer</button><button data-view="business" class="'+(view==='business'?'active':'')+'">Business</button></nav></header>'}
function bindNav(){app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view==='business')editorText=demoJSON();render()})}
function customerPage(){
const cats=menu.categories.filter(c=>c.items.some(matches));
const tabs='<div class="tabs"><button class="pill '+(category==='all'?'active':'')+'" data-cat="all">All</button>'+menu.categories.map(c=>'<button class="pill '+(category===c.id?'active':'')+'" data-cat="'+esc(c.id)+'">'+esc(c.name)+'</button>').join('')+'</div>';
const groups=menu.categories.filter(c=>(category==='all'||category===c.id)&&c.items.some(matches)).map(c=>'<section><h2 class="category" style="font-size:19px;margin:18px 16px 6px">'+esc(c.name)+'</h2>'+c.items.filter(matches).map(itemCard).join('')+'</section>').join('');
const count=Object.values(cart).reduce((n,x)=>n+x.qty,0),total=Object.values(cart).reduce((n,x)=>n+x.qty*x.price,0);
return '<section class="hero"><div class="eyebrow">TABLE LAB / MENU</div><h2>Eat well.<br>Enjoy more.</h2><p class="muted">Fresh ingredients. Great company.</p><div class="accentline"></div><div class="grid"><label class="field">Table number<input id="table" value="'+esc(table)+'" inputmode="numeric" placeholder="e.g. 3"></label><label class="field">Search dishes<input id="search" value="'+esc(query)+'" placeholder="Dish or ingredient"></label></div></section>'+tabs+(groups||'<div class="empty">No matching dishes.</div>')+'<section class="chatbox"><div class="chathead"><div><div class="eyebrow">NEED SOMETHING?</div><strong>Chat with the team</strong><div class="status">Ask a question or request help at your table.</div></div><button class="btn primary" id="openChat">'+(chatOpen?'Close chat':'Open chat')+'</button></div></section>'+(chatOpen?dinerChatMarkup():'')+(count?'<button class="cartbar" id="openCart"><span class="cartamount"><span>'+count+' item(s) · '+money(total)+'</span><span class="small">Your order</span></span><span class="cartcta">View order →</span></button>':'')+'<div class="bottom-space"></div>';
}
function matches(i){const q=query.toLocaleLowerCase();return !q||[i.name,i.description,...(i.allergens||[])].join(' ').toLocaleLowerCase().includes(q)}
function itemCard(i){const q=cart[i.id]?.qty||0;return '<article class="item"><div class="itemmain">'+(i.image&&/^https:\/\//i.test(i.image)?'<img class="dishphoto" loading="lazy" src="'+esc(i.image)+'" alt="'+esc(i.name)+'">':'')+'<div class="itemname">'+esc(i.name)+'</div><div class="desc">'+esc(i.description)+'</div><div class="price">'+money(i.price)+'</div>'+(i.allergens.length?'<div class="tags">'+i.allergens.map(a=>'<span class="tag">'+esc(a)+'</span>').join('')+'</div>':'')+(q?'<label class="field">Item note<input data-itemnote="'+esc(i.id)+'" value="'+esc(cart[i.id]?.note||'')+'" placeholder="No onion, allergy…"></label>':'')+'</div><button class="add" data-add="'+esc(i.id)+'" aria-label="Add '+esc(i.name)+'">+</button></article>'}
function cartPage(){const lines=Object.values(cart).filter(x=>x.qty>0),sum=lines.reduce((n,x)=>n+x.qty*x.price,0);return '<section class="screen"><button class="btn" id="back">← Menu</button><div class="eyebrow">YOUR ORDER</div><h2>Make it yours.</h2><p class="muted">Adjust quantities and add notes before sending.</p>'+(lines.length?lines.map(x=>'<div class="cartline"><div class="grow"><strong>'+esc(x.name)+'</strong><div class="small">'+money(x.price)+' each</div><div class="stepper"><button type="button" data-dec="'+esc(x.id)+'" aria-label="Decrease '+esc(x.name)+' quantity">−</button><b class="qty">'+x.qty+'</b><button type="button" data-inc="'+esc(x.id)+'" aria-label="Increase '+esc(x.name)+' quantity">+</button><button type="button" class="remove" data-remove="'+esc(x.id)+'" aria-label="Remove '+esc(x.name)+' from order">×</button></div>'+(x.note?'<div class="small">Note: '+esc(x.note)+'</div>':'')+'</div><strong>'+money(x.qty*x.price)+'</strong></div>').join(''):'<div class="empty">Your cart is empty.</div>')+'<label class="field">Table number<input id="orderTable" inputmode="numeric" value="'+esc(table)+'" placeholder="e.g. 3" required></label><label class="field">Order note<textarea id="orderNote" rows="3" placeholder="Any general requests">'+esc(orderNote)+'</textarea></label><div class="total"><span>Order total</span><span>'+money(sum)+'</span></div><p class="hint">No payment is taken. WhatsApp opens so you can review and send the message manually.</p><button class="btn full" id="chatOrder">Ask staff about this order</button><button class="btn primary full" id="send" '+(!lines.length?'disabled':'')+'>Continue to WhatsApp →</button></section>'}
function businessPage(){if(!editorText)editorText=demoJSON();return '<section class="panel"><div class="eyebrow">STAFF TOOLS</div><h2>Live inbox.</h2><p class="muted">Sign in with your restaurant staff account to view and reply to diners.</p>'+(staffAuthenticated?'<div class="notice success">Signed in as '+esc(staffEmail)+' <button class="btn" id="staffSignOut">Sign out</button></div><div id="businessChatStatus" class="notice">Connecting to live chat…</div><div id="businessThreads" class="threadlist"><div class="empty">Loading conversations…</div></div>':'<div class="authpanel"><h3>Staff sign in</h3><form id="staffLogin"><label class="field">Email<input id="staffEmail" type="email" autocomplete="username" required placeholder="staff@restaurant.com"></label><label class="field">Password<input id="staffPassword" type="password" autocomplete="current-password" required placeholder="Password"></label><button class="btn primary full" type="submit" '+(authBusy?'disabled':'')+'>Sign in</button><div id="authFeedback" class="small" aria-live="polite">Create the staff user in Supabase first; sign-up is disabled here.</div></form></div>' )+'<div class="accentline"></div><h2>Menu setup</h2><p class="muted">Load a menu file, adjust the JSON, then save it on this device.</p><div class="notice">Changes are stored in this browser when local storage is available. A different phone/browser has separate menu data.</div><h3>1. Load a menu file</h3><label class="field">Choose JSON or CSV file<input id="menuFile" type="file" accept=".json,.csv,application/json,text/csv"></label><p class="hint">JSON accepts a restaurant object with name, whatsapp, currency and categories. CSV headers: category,name,description,price,allergens. Use | between multiple allergens.</p><div class="row"><button class="btn" id="sample">Load demo menu</button><button class="btn" id="export">Export current menu</button></div><h3>2. Restaurant details and menu</h3><p class="hint">WhatsApp number uses international format, digits only. Accent is a hex colour.</p><textarea id="editor" class="editor" spellcheck="false" autocapitalize="off">'+esc(editorText)+'</textarea><div class="actions" style="margin-top:10px"><button class="btn primary" id="save">Validate and save menu</button><button class="btn" id="preview">Save and preview customer page</button></div><div id="feedback" aria-live="polite">'+(notice?'<p class="notice">'+esc(notice)+'</p>':'')+'</div><h3>3. Test chat and orders</h3><p class="hint">Open Customer on a second phone and use the same table number. WhatsApp remains the order fallback.</p><button class="btn full" id="clear">Reset saved menu on this device</button><p class="small">The chat requires internet and Supabase configuration. WhatsApp handoff also requires internet. No payment is taken.</p></section>'}
function showFeedback(msg,ok){const el=document.getElementById('feedback');if(el)el.innerHTML='<p class="'+(ok?'notice success':'error')+'">'+esc(msg)+'</p>'}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);if(rows.length<2)throw Error('CSV needs a header row and at least one menu item.');const headers=rows.shift().map(h=>h.trim().toLowerCase());const at=k=>headers.indexOf(k);if(at('name')<0||at('price')<0)throw Error('CSV must include at least name and price columns.');const cats={};rows.forEach((r,i)=>{const val=k=>at(k)<0?'':String(r[at(k)]||'').trim();const cat=val('category')||'Menu';if(!cats[cat])cats[cat]={id:slug(cat),name:cat,items:[]};const price=Number(val('price').replace(',','.'));if(!Number.isFinite(price)||price<0)throw Error('Invalid price on CSV row '+(i+2)+'.');const name=val('name');if(!name)throw Error('Missing item name on CSV row '+(i+2)+'.');cats[cat].items.push({id:slug(name)+'-'+(i+1),name,description:val('description'),price,allergens:val('allergens').split('|').map(x=>x.trim()).filter(Boolean)})});return {name:'Imported Restaurant',whatsapp:'',currency:'EUR',categories:Object.values(cats)}}

function normalCode(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'')}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function seededRandom(seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
function shuffleSeeded(list,seed){const a=list.slice(),rnd=seededRandom(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dailyPairs(x){const chosen=shuffleSeeded(x.keywords,x.secret+'|'+todayKey());return Array.from({length:x.tables},(_,i)=>({table:i+1,code:chosen[i]}))}
function validDailyCode(table,code){if(!menu.dailyShuffle){return normalCode(menu.keywords[table-1]||'')===code}return normalCode(dailyPairs(menu).find(p=>p.table===table)?.code||'')===code}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item'}
function parseImported(text,name){if((name||'').toLowerCase().endsWith('.csv')||text.trimStart().toLowerCase().startsWith('category,name,'))return parseCSV(text);let x=JSON.parse(text);if(x.restaurants){const id=Object.keys(x.restaurants)[0];if(!id)throw Error('No restaurants found in JSON.');x=x.restaurants[id]}if(!valid(x))throw Error('Menu structure is not valid. Include name, categories, category names, items, item names and numeric prices.');return normalise(x)}

function renderBusinessThreads(newUnread){const wrap=document.getElementById('businessThreads');if(!wrap)return;const keys=Object.keys(bizThreads).sort((a,b)=>Number(b)-Number(a));if(!keys.length){wrap.innerHTML='<div class="empty">No conversations yet. Messages from diners will appear here.</div>';return}wrap.innerHTML=keys.map(k=>{const ms=bizThreads[k],last=ms[ms.length-1],unread=unreadTables.has(k);return '<article class="threadcard '+(unread?'unread':'')+'" data-thread="'+esc(k)+'"><div class="threadhead"><h4>Table '+esc(k)+'</h4>'+(unread?'<span class="unreadbadge">NEW</span>':'')+'</div><div class="small">'+esc(last?last.body:'No messages')+'</div><div class="threadlog" id="threadlog-'+esc(k)+'">'+ms.map(m=>'<div class="chatbubble '+(m.sender==='business'?'mine':'staff')+'" data-mid="'+esc(m.id)+'">'+esc(m.body)+'<div class="chatmeta">'+esc(new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))+'</div></div>').join('')+'</div><form class="chatform" data-reply="'+esc(k)+'"><input maxlength="1000" placeholder="Reply to table '+esc(k)+'…" required><button aria-label="Send reply">↑</button></form></article>'}).join('');if(newUnread)unreadTables.add(String(newUnread));wrap.querySelectorAll('[data-thread]').forEach(card=>card.onclick=e=>{if(e.target.closest('form'))return;const k=card.dataset.thread;unreadTables.delete(k);card.classList.remove('unread');const badge=card.querySelector('.unreadbadge');if(badge)badge.remove()});wrap.querySelectorAll('[data-reply]').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const T=Number(form.dataset.reply),input=form.querySelector('input'),body=input.value.trim();if(!body)return;const sb=supabaseClient();input.value='';const thread=bizThreads[String(T)]||[],lastTableMessage=[...thread].reverse().find(m=>m.sender==='table');if(!lastTableMessage){alert('This table has not opened a chat yet.');return}const row={restaurant_id:TL_CONFIG.restaurantId,table_no:T,diner_uid:lastTableMessage.diner_uid,daily_code:'',sender:'business',body};const {data,error}=await sb.from('messages').insert(row).select('*').single();if(error){alert('Reply not sent: '+error.message);input.value=body;return}const arr=bizThreads[String(T)]||(bizThreads[String(T)]=[]);if(data&&!arr.some(m=>String(m.id)===String(data.id)))arr.push(data);renderBusinessThreads();const newForm=wrap.querySelector('[data-reply="'+T+'"] input');if(newForm)newForm.focus()});wrap.querySelectorAll('.threadlog').forEach(l=>l.scrollTop=l.scrollHeight)}
})();
</script></body></html>
