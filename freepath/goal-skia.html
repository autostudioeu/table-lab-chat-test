<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a1f">
<title>Freepath – My Goal (Skia)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#02040d;overflow:hidden}
#app{position:relative;margin:0 auto;height:100%;max-height:100vh;aspect-ratio:9/19.5;max-width:100vw;overflow:hidden;background:#030616}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5a6390;font:13px system-ui}
</style></head><body>
<div id="app"><div id="load">Loading Skia…</div><canvas id="c"></canvas></div>
<script src="https://unpkg.com/canvaskit-wasm@0.39.1/bin/canvaskit.js"></script>
<script>
// Everything below is drawn with Skia (CanvasKit = the engine inside @shopify/react-native-skia).
const PROGRESS=0.23, TARGET=1000000, DURATION=1800;
const FONT='https://cdn.jsdelivr.net/npm/@expo-google-fonts/inter@0.2.3/';
const rnd=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-Math.pow(1-t,3);
const fmt=n=>'€'+Math.round(n).toLocaleString('en-US');
function ringColor(ang){const v=(1-Math.cos(ang))/2,s=[[255,190,90],[255,120,60],[190,80,200],[90,110,255]];
  const p=v*3,i=Math.min(2,Math.floor(p)),f=p-i;return s[i].map((c,k)=>lerp(c,s[i+1][k],f)/255)}
Promise.all([
  CanvasKitInit({locateFile:f=>'https://unpkg.com/canvaskit-wasm@0.39.1/bin/'+f}),
  ...['Inter_400Regular','Inter_600SemiBold','Inter_800ExtraBold','Inter_900Black'].map(n=>fetch(FONT+n+'.ttf').then(r=>r.arrayBuffer()))
]).then(([CK,...fb])=>{
  document.getElementById('load').remove();
  const TF=fb.map(b=>CK.Typeface.MakeFreeTypeFaceFromData(b));
  const [REG,SEMI,BOLD,BLACK]=TF;
  const app=document.getElementById('app'),cv=document.getElementById('c');
  let W,H,dpr,cx,cy,R,surface,stars=[],ring=[],sparks=[],hzPath,treePath,t0=null,last=0,raf=0;
  const fonts={};const font=(tf,sz)=>{const k=TF.indexOf(tf)+':'+sz.toFixed(2);return fonts[k]||(fonts[k]=(()=>{const f=new CK.Font(tf,sz);f.setSubpixel(true);f.setEdging(CK.FontEdging.SubpixelAntiAlias);return f})())};
  const tw=(f,s)=>f.getGlyphWidths(f.getGlyphIDs(s)).reduce((a,b)=>a+b,0);
  const clamp=(a,v,b)=>Math.max(a,Math.min(b,v));
  const P=new CK.Paint();P.setAntiAlias(true);
  function text(s,x,y,tf,sz,col,align='center',paint){const f=font(tf,sz),w=tw(f,s);const p=paint||P;
    if(!paint){p.setShader(null);p.setMaskFilter(null);p.setStyle(CK.PaintStyle.Fill);p.setBlendMode(CK.BlendMode.SrcOver);p.setColor(col)}
    canvas.drawText(s,align=='center'?x-w/2:x,y,p,f);return w}
  let canvas;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2.5);const r=app.getBoundingClientRect();W=r.width;H=r.height;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    if(surface)surface.delete();surface=CK.MakeWebGLCanvasSurface(cv)||CK.MakeSWCanvasSurface(cv);canvas=surface.getCanvas();
    cx=W/2;cy=H*0.48;R=Math.min(W*0.38,H*0.2);
    stars=[];const n=Math.round(W*H/2000);
    for(let i=0;i<n;i++){const l=i%3;stars.push({x:Math.random()*W,y:Math.random()*H*0.9,l,r:[0.5,0.8,1.2][l]*rnd(.6,1.2),s:[3,6,11][l],tw:rnd(.5,2),ph:rnd(0,6.28),a:rnd(.3,.9)})}
    ring=[];const m=Math.round(R*10);
    for(let i=0;i<m;i++){const a=Math.random()*Math.PI*2,d=(Math.random()+Math.random()+Math.random()-1.5)*R*0.07;ring.push({a,d,r:rnd(.4,1.4),ph:rnd(0,6.28),sp:rnd(1,3),c:ringColor(a)})}
    // treeline paths (Skia Path)
    const hh=H*0.2,top=H*0.8;hzPath=new CK.Path();hzPath.moveTo(0,top+hh);
    for(let x=0;x<=W;x+=4)hzPath.lineTo(x,top+hh*0.45-Math.sin(x*0.012)*hh*0.08-Math.sin(x*0.031+1)*hh*0.04);
    hzPath.lineTo(W,top+hh);hzPath.close();
    treePath=new CK.Path();
    for(let x=-5;x<W+5;x+=rnd(5,11)){const th=rnd(hh*.12,hh*.32),b=top+hh*0.6+rnd(0,hh*.05),w=th*0.28;treePath.moveTo(x,b-th);treePath.lineTo(x+w,b);treePath.lineTo(x-w,b);treePath.close()}
    treePath.addRect(CK.XYWHRect(0,top+hh*0.6,W,hh));
  }
  const C=(r,g,b,a=1)=>CK.Color4f(r,g,b,a);
  function frame(now){
    raf=requestAnimationFrame(frame);
    if(t0===null)t0=location.hash=='#end'?now-DURATION-5000:now;
    const t=(now-t0)/1000,dt=Math.min(.05,(now-(last||now))/1000);last=now;
    const k=ease(Math.min(1,(now-t0)/DURATION)),prog=PROGRESS*k,pulse=0.5+0.5*Math.sin(t*2.2);
    canvas.save();canvas.scale(dpr,dpr);
    // background radial gradient
    P.setBlendMode(CK.BlendMode.SrcOver);P.setMaskFilter(null);P.setStyle(CK.PaintStyle.Fill);
    const bg=CK.Shader.MakeTwoPointConicalGradient([W/2,H*0.35],0,[W/2,H*0.35],H*0.75,[C(.06,.10,.27),C(.027,.05,.17),C(.012,.024,.086)],[0,.45,1],CK.TileMode.Clamp,CK.Matrix.scaled(1.2*W/(H*0.7),1,W/2,H*0.35));
    P.setShader(bg);canvas.drawPaint(P);P.setShader(null);bg.delete();
    // stars: 3 parallax layers, additive
    P.setBlendMode(CK.BlendMode.Plus);
    for(const s of stars){const y=(s.y+t*s.s)%(H*0.9),x=(s.x+t*s.s*0.3)%W,a=s.a*(0.6+0.4*Math.sin(t*s.tw+s.ph));
      P.setColor(C(.78,.84,1,a));canvas.drawCircle(x,y,s.r,P);
      if(s.l==2&&a>.7){P.setMaskFilter(CK.MaskFilter.MakeBlur(CK.BlurStyle.Normal,2,true));P.setColor(C(.6,.7,1,a*.35));canvas.drawCircle(x,y,s.r*3,P);P.setMaskFilter(null)}}
    // ring base glow: sweep gradient stroke + blur (shimmer = slow rotation wobble)
    const rot=Math.sin(t*0.6)*6;
    const cols=[],pos=[];for(let i=0;i<=24;i++){const c=ringColor(i/24*6.283);cols.push(C(c[0],c[1],c[2],1));pos.push(i/24)}
    const sw=CK.Shader.MakeSweepGradient(cx,cy,cols,pos,CK.TileMode.Clamp,CK.Matrix.rotated((rot-90)*Math.PI/180,cx,cy));
    P.setShader(sw);P.setStyle(CK.PaintStyle.Stroke);P.setStrokeWidth(R*0.14);P.setAlphaf(0.09+0.02*pulse);
    P.setMaskFilter(CK.MaskFilter.MakeBlur(CK.BlurStyle.Normal,R*0.04,true));canvas.drawCircle(cx,cy,R,P);
    P.setStrokeWidth(R*0.05);P.setAlphaf(0.10);P.setMaskFilter(null);canvas.drawCircle(cx,cy,R,P);
    P.setShader(null);sw.delete();P.setStyle(CK.PaintStyle.Fill);
    // ring particles (shimmer)
    for(const p of ring){const tv=0.45+0.55*Math.sin(t*p.sp+p.ph),rr=R+p.d+Math.sin(t*0.8+p.ph)*0.6;
      const x=cx+Math.sin(p.a)*rr,y=cy-Math.cos(p.a)*rr;P.setColor(C(p.c[0],p.c[1],p.c[2],0.35+0.5*tv));
      canvas.drawRect(CK.XYWHRect(x-p.r/2,y-p.r/2,p.r,p.r),P)}
    // progress arc
    const end=prog*360;
    if(end>0.05){
      const ov=CK.LTRBRect(cx-R,cy-R,cx+R,cy+R),path=new CK.Path();path.addArc(ov,-90,end);
      P.setStyle(CK.PaintStyle.Stroke);P.setStrokeCap(CK.StrokeCap.Round);
      [[R*0.34,R*0.12,[1,.45,.15],0.16+0.08*pulse],[R*0.16,R*0.05,[1,.6,.2],0.35+0.12*pulse],[R*0.06,R*0.012,[1,.72,.3],0.8],[R*0.022,0,[1,.95,.82],1]].forEach(([w,b,c,a])=>{
        P.setStrokeWidth(w);P.setColor(C(c[0],c[1],c[2],a));P.setMaskFilter(b?CK.MaskFilter.MakeBlur(CK.BlurStyle.Normal,b,true):null);canvas.drawPath(path,P)});
      path.delete();P.setMaskFilter(null);P.setStyle(CK.PaintStyle.Fill);
      const A1=(-90+end)*Math.PI/180,hx=cx+Math.cos(A1)*R,hy=cy+Math.sin(A1)*R,hr=R*(0.38+0.08*pulse);
      const g=CK.Shader.MakeRadialGradient([hx,hy],hr,[C(1,.96,.85,.95),C(1,.67,.27,.55),C(1,.4,.12,0)],[0,.22,1],CK.TileMode.Clamp);
      P.setShader(g);canvas.drawCircle(hx,hy,hr,P);P.setShader(null);g.delete();
      P.setColor(C(1,1,.95,1));P.setMaskFilter(CK.MaskFilter.MakeBlur(CK.BlurStyle.Solid,3,true));canvas.drawCircle(hx,hy,R*0.025,P);P.setMaskFilter(null);
      const endR=end*Math.PI/180,nE=Math.min(6,Math.round(dt*240));
      for(let i=0;i<nE;i++){const a=A1-Math.random()*Math.min(endR,0.5)*Math.random(),out=rnd(-0.4,1),nx=Math.cos(a),ny=Math.sin(a),sp=rnd(10,45);
        sparks.push({x:cx+nx*R,y:cy+ny*R,vx:(nx*out-ny*rnd(.3,1))*sp,vy:(ny*out+nx*rnd(.3,1))*sp,life:0,max:rnd(.6,1.8),r:rnd(.5,1.8)})}
    }
    P.setMaskFilter(CK.MaskFilter.MakeBlur(CK.BlurStyle.Solid,0.8,true));
    for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life+=dt;if(s.life>s.max){sparks.splice(i,1);continue}
      s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=0.985;s.vy*=0.985;const f=1-s.life/s.max;
      P.setColor(C(1,(150+90*f)/255,80*f/255,f));canvas.drawCircle(s.x,s.y,s.r*(0.5+f),P)}
    P.setMaskFilter(null);P.setBlendMode(CK.BlendMode.SrcOver);
    // treeline
    P.setColor(C(.24,.31,.67,.10));canvas.drawRect(CK.XYWHRect(0,H*0.86,W,H*0.02),P);
    P.setColor(C(.012,.024,.08));canvas.drawPath(hzPath,P);P.setColor(C(.004,.012,.047));canvas.drawPath(treePath,P);
    const hg=CK.Shader.MakeLinearGradient([0,H*0.8],[0,H],[C(.008,.016,.055,0),C(.008,.016,.055,.9),C(.004,.008,.04,1)],[0,.45,1],CK.TileMode.Clamp);
    P.setShader(hg);canvas.drawRect(CK.XYWHRect(0,H*0.8,W,H*0.2),P);P.setShader(null);hg.delete();
    // ---- text (Skia Font + Inter TTF) ----
    const vw=W/100,s1=clamp(12,3.6*vw,15),dim=C(.68,.71,.84);
    text('My Goal',cx,H*0.11+s1,REG,s1,dim);
    const h1=clamp(26,8.2*vw,36);text('Financial Freedom',cx,H*0.11+s1+6+h1*1.05,BOLD,h1,C(1,1,1));
    const s2=clamp(13,3.9*vw,16);text('Be free from the 9/5 job',cx,H*0.11+s1+12+h1*1.25+s2,REG,s2,C(.76,.79,.9,.85));
    const am=clamp(30,9.6*vw,42),ay=cy+am*0.25;
    P.setMaskFilter(CK.MaskFilter.MakeBlur(CK.BlurStyle.Normal,10,true));P.setColor(C(1,.67,.31,.28));
    const af=font(BOLD,am);canvas.drawText('€1,000,000',cx-tw(af,'€1,000,000')/2,ay,P,af);P.setMaskFilter(null);
    text('€1,000,000',cx,ay,BOLD,am,C(1,1,1));text('Target amount',cx,ay+s1+10,REG,s1,dim);
    const sy=H*0.72,sb=clamp(22,7*vw,30),ss=clamp(11,3.4*vw,14),c1=W*0.1+W*0.2,c2=W*0.7;
    text(Math.round(prog*100)+'%',c1,sy+sb,BOLD,sb,C(1,1,1));text('Achieved',c1,sy+sb+ss+10,REG,ss,dim);
    text(fmt(TARGET*prog),c2,sy+sb,BOLD,sb,C(1,1,1));text('Current net worth',c2,sy+sb+ss+10,REG,ss,dim);
    P.setColor(C(1,1,1,.12));canvas.drawRect(CK.XYWHRect(W/2-0.5,sy,1,sb+ss+18),P);
    // glass card: backdrop blur via saveLayer + ImageFilter
    const ch=Math.max(64,W*0.17),card=CK.RRectXY(CK.XYWHRect(W*0.06,H*0.95-ch,W*0.88,ch),22,22);
    P.setColor(C(0,0,0,.45));P.setMaskFilter(CK.MaskFilter.MakeBlur(CK.BlurStyle.Normal,16,true));canvas.drawRRect(CK.RRectXY(CK.XYWHRect(W*0.06,H*0.95-ch+10,W*0.88,ch),22,22),P);P.setMaskFilter(null);
    canvas.save();canvas.clipRRect(card,CK.ClipOp.Intersect,true);
    const bf=CK.ImageFilter.MakeBlur(14*dpr,14*dpr,CK.TileMode.Clamp,null);canvas.saveLayer(null,null,bf);canvas.restore();bf.delete();
    const cg=CK.Shader.MakeLinearGradient([W*0.06,H*0.95-ch],[W*0.94,H*0.95],[C(1,1,1,.12),C(1,1,1,.04)],null,CK.TileMode.Clamp);
    P.setShader(cg);canvas.drawRRect(card,P);P.setShader(null);cg.delete();
    P.setColor(C(1,1,1,.15));canvas.drawRect(CK.XYWHRect(W*0.06,H*0.95-ch,W*0.88,1),P);canvas.restore();
    P.setStyle(CK.PaintStyle.Stroke);P.setStrokeWidth(1);P.setColor(C(1,1,1,.16));canvas.drawRRect(card,P);P.setStyle(CK.PaintStyle.Fill);
    const qy=H*0.95-ch/2,qx=W*0.06+20,qf=font(BLACK,44);
    const qg=CK.Shader.MakeLinearGradient([0,qy-10],[0,qy+14],[C(1,.75,.44),C(1,.48,.16)],null,CK.TileMode.Clamp);P.setShader(null);P.setMaskFilter(null);P.setColor(C(1,.6,.25,1));P.setShader(qg);
    canvas.drawText('“',qx,qy+30,P,qf);P.setShader(null);qg.delete();
    const qs=clamp(14,4.2*vw,17);text('You are closer than you think.',qx+tw(qf,'“')+14,qy+qs*0.36,SEMI,qs,C(.93,.94,.98),'left');
    // badge
    const bs=10,bw=tw(font(SEMI,bs),'Rendered with Skia')+16,br=CK.RRectXY(CK.XYWHRect(W-bw-8,8,bw,18),9,9);
    P.setColor(C(1,1,1,.08));canvas.drawRRect(br,P);text('Rendered with Skia',W-bw/2-8,21,SEMI,bs,C(1,.72,.4,.9));
    canvas.restore();surface.flush();
  }
  function start(){if(!raf){last=0;raf=requestAnimationFrame(frame)}}
  let pauseAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;pauseAt=performance.now()}else{if(t0!==null)t0+=performance.now()-pauseAt;start()}});
  addEventListener('resize',resize);resize();start();
});
</script></body></html>
