<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a1f">
<title>Freepath – My Goal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#02040d;overflow:hidden;font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;color:#fff}
#app{position:relative;margin:0 auto;height:100%;max-height:100vh;aspect-ratio:9/19.5;max-width:100vw;overflow:hidden;background:radial-gradient(120% 70% at 50% 35%,#0f1a45 0%,#070d2b 45%,#030616 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.head{margin-top:11%;text-align:center}
.lbl{font-size:clamp(12px,3.6vw,15px);color:#aeb6d6;letter-spacing:.04em}
h1{font-size:clamp(26px,8.2vw,36px);font-weight:800;margin-top:6px;letter-spacing:-.01em}
.sub{font-size:clamp(13px,3.9vw,16px);color:#c3c9e6;margin-top:6px;opacity:.85}
.center{position:absolute;left:0;right:0;top:48%;transform:translateY(-50%);text-align:center}
.amt{font-size:clamp(30px,9.6vw,42px);font-weight:800;letter-spacing:-.01em;text-shadow:0 0 24px rgba(255,170,80,.25)}
.tgt{font-size:clamp(12px,3.6vw,15px);color:#aeb6d6;margin-top:4px}
.stats{position:absolute;top:72%;left:10%;right:10%;display:flex;justify-content:space-between}
.stat{text-align:center;flex:1}
.stat b{display:block;font-size:clamp(22px,7vw,30px);font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:clamp(11px,3.4vw,14px);color:#aeb6d6}
.stat+.stat{border-left:1px solid rgba(255,255,255,.12)}
.card{position:absolute;bottom:5%;left:6%;right:6%;padding:18px 20px;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15);display:flex;align-items:center;gap:14px}
.q{font-size:44px;line-height:.6;font-weight:900;background:linear-gradient(#ffc070,#ff7a2a);-webkit-background-clip:text;background-clip:text;color:transparent;padding-top:14px}
.card p{font-size:clamp(14px,4.2vw,17px);font-weight:600;color:#eef0fa}
</style></head><body>
<div id="app"><canvas id="c"></canvas>
<div class="ui">
 <div class="head"><div class="lbl">My Goal</div><h1>Financial Freedom</h1><div class="sub">Be free from the 9/5 job</div></div>
 <div class="center"><div class="amt">€1,000,000</div><div class="tgt">Target amount</div></div>
 <div class="stats"><div class="stat"><b id="pct">0%</b><span>Achieved</span></div><div class="stat"><b id="nw">€0</b><span>Current net worth</span></div></div>
 <div class="card"><div class="q">&ldquo;</div><p>You are closer than you think.</p></div>
</div></div>
<script>
const PROGRESS = 0.23;           // goal progress (0..1)
const TARGET = 1000000;          // target amount in €
const DURATION = 1800;           // intro animation ms
const app=document.getElementById('app'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
const pctEl=document.getElementById('pct'),nwEl=document.getElementById('nw');
let W,H,dpr,cx,cy,R,stars=[],ring=[],sparks=[],t0=null,raf=0,last=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function lerp(a,b,t){return a+(b-a)*t}
function ringColor(ang){ // ang: 0 top, clockwise, 0..2PI ; bottom blue/violet, top orange/gold
  const v=(1-Math.cos(ang))/2; // 0 top,1 bottom
  const s=[[255,190,90],[255,120,60],[190,80,200],[90,110,255]];
  const p=v*3,i=Math.min(2,Math.floor(p)),f=p-i;
  return s[i].map((c,k)=>Math.round(lerp(c,s[i+1][k],f)));
}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  const r=app.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;cy=H*0.48;R=Math.min(W*0.38,H*0.2);
  stars=[];const n=Math.round(W*H/2200);
  for(let i=0;i<n;i++){const l=i%3;stars.push({x:Math.random()*W,y:Math.random()*H*0.9,l,r:[0.5,0.8,1.2][l]*rnd(.6,1.2),s:[3,6,11][l],tw:rnd(.5,2),ph:rnd(0,6.28),a:rnd(.3,.9)})}
  ring=[];const m=Math.round(R*9);
  for(let i=0;i<m;i++){const a=Math.random()*Math.PI*2,d=(Math.random()+Math.random()+Math.random()-1.5)*R*0.07;
    ring.push({a,d,r:rnd(.4,1.4),ph:rnd(0,6.28),sp:rnd(1,3),c:ringColor(a)})}
  buildHorizon();
}
let hz;
function buildHorizon(){
  hz=document.createElement('canvas');hz.width=W*dpr;hz.height=H*0.2*dpr;const h=hz.getContext('2d');h.scale(dpr,dpr);
  const hh=H*0.2,g=h.createLinearGradient(0,0,0,hh);g.addColorStop(0,'rgba(2,4,14,0)');g.addColorStop(.45,'rgba(2,4,14,.9)');g.addColorStop(1,'#01020a');
  h.fillStyle='rgba(60,80,170,.10)';h.fillRect(0,hh*0.3,W,hh*0.1);
  h.fillStyle='#030614';h.beginPath();h.moveTo(0,hh);
  for(let x=0;x<=W;x+=4){const y=hh*0.45-Math.sin(x*0.012)*hh*0.08-Math.sin(x*0.031+1)*hh*0.04;h.lineTo(x,y)}
  h.lineTo(W,hh);h.fill();
  h.fillStyle='#01030c';
  for(let x=-5;x<W+5;x+=rnd(5,11)){const th=rnd(hh*.12,hh*.32),b=hh*0.6+rnd(0,hh*.05),w=th*0.28;
    h.beginPath();h.moveTo(x,b-th);h.lineTo(x+w,b);h.lineTo(x-w,b);h.fill()}
  h.fillRect(0,hh*0.6,W,hh);
  h.fillStyle=g;h.fillRect(0,0,W,hh);
}
const ease=t=>1-Math.pow(1-t,3);
const fmt=n=>'€'+Math.round(n).toLocaleString('en-US');
function frame(now){
  raf=requestAnimationFrame(frame);
  if(t0===null)t0=location.hash=="#end"?now-DURATION:now;const t=(now-t0)/1000,dt=Math.min(.05,(now-(last||now))/1000);last=now;
  const k=ease(Math.min(1,(now-t0)/DURATION)),prog=PROGRESS*k;
  pctEl.textContent=Math.round(prog*100)+'%';nwEl.textContent=fmt(TARGET*prog);
  ctx.clearRect(0,0,W,H);
  // stars
  ctx.globalCompositeOperation='lighter';
  for(const s of stars){const y=(s.y+t*s.s)%(H*0.9),x=(s.x+t*s.s*0.3)%W;
    const a=s.a*(0.6+0.4*Math.sin(t*s.tw+s.ph));ctx.fillStyle='rgba(200,215,255,'+a+')';
    ctx.beginPath();ctx.arc(x,y,s.r,0,6.283);ctx.fill()}
  // ring base glow
  const pulse=0.5+0.5*Math.sin(t*2.2);
  ctx.lineWidth=R*0.12;
  for(let i=0;i<48;i++){const a0=i/48*6.283,a1=(i+1)/48*6.283+0.01,c=ringColor(a0+0.06);
    ctx.strokeStyle='rgba('+c+',0.07)';ctx.beginPath();ctx.arc(cx,cy,R,a0-Math.PI/2,a1-Math.PI/2);ctx.stroke()}
  // particles
  for(const p of ring){const tw=0.45+0.55*Math.sin(t*p.sp+p.ph),rr=R+p.d+Math.sin(t*0.8+p.ph)*0.6;
    const x=cx+Math.sin(p.a)*rr,y=cy-Math.cos(p.a)*rr;
    ctx.fillStyle='rgba('+p.c+','+(0.35+0.5*tw)+')';ctx.fillRect(x-p.r/2,y-p.r/2,p.r,p.r)}
  // bright arc
  const end=prog*6.283;
  if(end>0.001){
    const A0=-Math.PI/2,A1=A0+end;
    ctx.lineCap='round';
    [[R*0.32,0.10+0.05*pulse],[R*0.16,0.22+0.08*pulse],[R*0.06,0.6],[R*0.022,1]].forEach(([w,a],i)=>{
      ctx.lineWidth=w;ctx.strokeStyle=i==3?'rgba(255,240,200,'+a+')':'rgba(255,'+(130+i*30)+',50,'+a+')';
      ctx.beginPath();ctx.arc(cx,cy,R,A0,A1);ctx.stroke()});
    const hx=cx+Math.cos(A1)*R,hy=cy+Math.sin(A1)*R,hr=R*(0.35+0.08*pulse);
    const g=ctx.createRadialGradient(hx,hy,0,hx,hy,hr);g.addColorStop(0,'rgba(255,245,215,.95)');g.addColorStop(.2,'rgba(255,170,70,.6)');g.addColorStop(1,'rgba(255,100,30,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx,hy,hr,0,6.283);ctx.fill();
    // emit sparks
    const nE=Math.min(6,Math.round(dt*240));
    for(let i=0;i<nE;i++){const a=A1-Math.random()*Math.min(end,0.5)*Math.random(),out=rnd(-0.4,1);
      const nx=Math.cos(a),ny=Math.sin(a),tx=-ny,ty=nx,sp=rnd(10,45);
      sparks.push({x:cx+nx*R,y:cy+ny*R,vx:(nx*out+tx*rnd(.3,1))*sp,vy:(ny*out+ty*rnd(.3,1))*sp,life:0,max:rnd(.6,1.8),r:rnd(.5,1.8)})}
  }
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life+=dt;if(s.life>s.max){sparks.splice(i,1);continue}
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=0.985;s.vy*=0.985;const f=1-s.life/s.max;
    ctx.fillStyle='rgba(255,'+Math.round(150+90*f)+','+Math.round(80*f)+','+f+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r*(0.5+f),0,6.283);ctx.fill()}
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(hz,0,H*0.8,W,H*0.2);
}
function start(){if(!raf){last=0;raf=requestAnimationFrame(frame)}}
function stop(){cancelAnimationFrame(raf);raf=0}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else{start()}});
let pauseAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAt=performance.now();else if(t0!==null)t0+=performance.now()-pauseAt});
addEventListener('resize',resize);resize();start();
</script></body></html>
